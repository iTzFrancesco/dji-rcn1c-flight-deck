name: Android gamepad branch CI

on:
  push:
    branches:
      - feature/android-virtual-gamepad
    paths:
      - 'wireless/android-app/**'
      - '.github/workflows/android-gamepad-ci.yml'
  pull_request:
    paths:
      - 'wireless/android-app/**'
      - '.github/workflows/android-gamepad-ci.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install only required Android toolchain
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" "cmake;3.22.1" "ndk;26.3.11579264"

      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Restore stable key when available
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.RCN1C_ANDROID_DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p "$HOME/.android"
            printf '%s' "$KEYSTORE_B64" | base64 --decode > "$HOME/.android/debug.keystore"
            chmod 600 "$HOME/.android/debug.keystore"
            echo "Stable signing key restored."
          else
            echo "Stable signing key unavailable: building test APK only."
          fi

      - name: Compile unified APK
        working-directory: wireless/android-app
        run: gradle --no-daemon clean assembleRelease

      - name: Upload branch APK
        uses: actions/upload-artifact@v4
        with:
          name: RCN1C-Flight-Bridge-android-gamepad
          path: wireless/android-app/build/outputs/apk/release/*.apk
