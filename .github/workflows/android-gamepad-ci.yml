name: Android gamepad branch CI

on:
  push:
    branches:
      - feature/android-virtual-gamepad
    paths:
      - 'wireless/android-app/**'
      - '.github/workflows/android-gamepad-ci.yml'
  pull_request:
    paths:
      - 'wireless/android-app/**'
      - '.github/workflows/android-gamepad-ci.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub's Android runner already ships cmdline-tools. Avoid setup-android here:
      # it was downloading the legacy SDK tools/emulator even though this project never uses them.
      - name: Install only required Android toolchain
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" "cmake;3.22.1" "ndk;26.3.11579264"

      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compile unified APK
        working-directory: wireless/android-app
        run: gradle --no-daemon assembleRelease

      - name: Upload branch APK
        uses: actions/upload-artifact@v4
        with:
          name: RCN1C-Flight-Bridge-android-gamepad
          path: wireless/android-app/build/outputs/apk/release/*.apk
