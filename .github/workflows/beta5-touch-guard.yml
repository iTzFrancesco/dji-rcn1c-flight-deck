name: Build beta5 touch guard

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/beta5-touch-guard.yml'

permissions:
  contents: write

env:
  VERSION: 3.3.0-beta5
  TAG: v3.3.0-beta5

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Apply touch isolation patch
        run: python tools/patch_beta5_touch_guard.py

      - name: Verify beta5 source guards
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'foregroundPackage.equals(armedPackage)' wireless/android-app/src/com/drone/rcn1cbridge/PortableTouchAccessibilityService.java
          grep -q 'safeBottom' wireless/android-app/src/com/drone/rcn1cbridge/PortableTouchAccessibilityService.java
          grep -q 'armForGame(targetGamePackage' wireless/android-app/src/com/drone/rcn1cbridge/PortableTouchActivity.java
          grep -q 'versionName = "3.3.0-beta5"' wireless/android-app/build.gradle.kts

      - name: Install Android toolchain
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Download stable signing key
        uses: actions/download-artifact@v4
        with:
          name: RCN1C-beta2-v2v3-stable
          run-id: 32875790849
          github-token: ${{ github.token }}
          path: stable-key

      - name: Build and sign beta5
        shell: bash
        run: |
          set -euo pipefail
          cd wireless/android-app
          gradle --no-daemon clean assembleRelease
          cd ../..
          INPUT=$(find wireless/android-app/build/outputs/apk/release -name '*.apk' | head -n1)
          KEYSTORE=$(find stable-key -name 'RCN1C_Flight_Bridge_signing.keystore' | head -n1)
          APKSIGNER="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          "$APKSIGNER" sign --ks "$KEYSTORE" --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android --v2-signing-enabled true --v3-signing-enabled true --out wireless/RCN1C_Bridge.apk "$INPUT"
          "$APKSIGNER" verify --verbose --print-certs wireless/RCN1C_Bridge.apk | tee /tmp/signing.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' /tmp/signing.txt
          grep -qi '7ff5f60b8917bd6c265a38ab6581a027ca4d571e2a5d4bf7d3e7becd04d131a7' /tmp/signing.txt
          sha256sum wireless/RCN1C_Bridge.apk | tee /tmp/SHA256SUMS.txt

      - name: Commit beta5 to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm tools/patch_beta5_touch_guard.py .github/workflows/beta5-touch-guard.yml
          git add -A
          git commit -m 'fix(android): isolate Portable Touch from system UI in beta5'
          git push origin HEAD:main

      - name: Publish beta5 release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: main
          name: RC-N1C Flight Bridge v${{ env.VERSION }}
          prerelease: false
          make_latest: true
          body: |
            Portable Touch safety fix: synthetic touches are now emitted only while the exact supported simulator package is foreground. Touches are released immediately when Android System UI, Recents, Home, or another app takes foreground, and coordinates are clamped away from system gesture edges.
          files: wireless/RCN1C_Bridge.apk

      - name: Upload beta5 APK
        uses: actions/upload-artifact@v4
        with:
          name: RCN1C-Flight-Bridge-v3.3.0-beta5-STABLE
          path: wireless/RCN1C_Bridge.apk
