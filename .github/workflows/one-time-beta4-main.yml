              if path.exists(): path.unlink()
          for rel in [
              'wireless/android-app/src/com/drone/rcn1cbridge/uinput',
              'wireless/android-app/cpp',
          ]:
              path = root / rel
              if path.exists(): shutil.rmtree(path)

          # Future stable tag releases: no NDK, and verify the persistent beta2+ certificate.
          expr = '$' + '{{ secrets.RCN1C_ANDROID_DEBUG_KEYSTORE_B64 }}'
          release = f'''name: Android release\n\non:\n  push:\n    tags:\n      - 'v*'\n\npermissions:\n  contents: write\n\njobs:\n  build-apk:\n    if: ${{{{ !contains(github.ref_name, '-beta') }}}}\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n\n      - uses: actions/setup-java@v4\n        with:\n          distribution: temurin\n          java-version: '17'\n\n      - name: Install Android toolchain\n        shell: bash\n        run: |\n          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"\n          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"\n\n      - uses: gradle/actions/setup-gradle@v4\n        with:\n          gradle-version: '8.7'\n\n      - name: Restore stable Android signing key\n        shell: bash\n        env:\n          KEYSTORE_B64: {expr}\n        run: |\n          test -n "$KEYSTORE_B64" || {{ echo "Missing RCN1C_ANDROID_DEBUG_KEYSTORE_B64"; exit 1; }}\n          mkdir -p "$HOME/.android"\n          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$HOME/.android/debug.keystore"\n          chmod 600 "$HOME/.android/debug.keystore"\n\n      - name: Build and verify Flight Bridge APK\n        shell: bash\n        run: |\n          cd wireless/android-app\n          gradle --no-daemon clean assembleRelease\n          cp build/outputs/apk/release/*.apk ../RCN1C_Bridge.apk\n          APKSIGNER="$ANDROID_HOME/build-tools/34.0.0/apksigner"\n          "$APKSIGNER" verify --verbose --print-certs ../RCN1C_Bridge.apk | tee /tmp/signing.txt\n          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' /tmp/signing.txt\n          grep -qi '7ff5f60b8917bd6c265a38ab6581a027ca4d571e2a5d4bf7d3e7becd04d131a7' /tmp/signing.txt\n\n      - name: Publish GitHub release\n        uses: softprops/action-gh-release@v2\n        with:\n          files: wireless/RCN1C_Bridge.apk\n          generate_release_notes: true\n'''
          (root / '.github/workflows/release.yml').write_text(release, encoding='utf-8')

          # Guard against accidentally leaving the removed backend wired into the app.
          active = '\n'.join(p.read_text(errors='ignore') for p in (root / 'wireless/android-app').rglob('*') if p.is_file() and p.suffix in {'.java','.kt','.kts','.xml','.aidl','.cpp','.txt'})
          for forbidden in ['rikka.shizuku', 'GamepadActivity', 'GamepadBridgeService', 'UInputService', 'uinput_jni']:
              if forbidden in active:
                  raise SystemExit(f'Legacy gamepad reference still active: {forbidden}')

      - name: Install Android SDK + Gradle
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Download persistent signing key
        uses: actions/download-artifact@v4
        with:
          name: RCN1C-beta2-v2v3-stable
          run-id: 32875790849
          github-token: ${{ github.token }}
          path: stable-key

      - name: Build, sign and verify beta4
        shell: bash
        run: |
          set -euo pipefail
          cd wireless/android-app
          gradle --no-daemon clean assembleRelease
          cd ../..
          INPUT=$(find wireless/android-app/build/outputs/apk/release -name '*.apk' | head -n1)
          KEYSTORE=$(find stable-key -name 'RCN1C_Flight_Bridge_signing.keystore' | head -n1)
          APKSIGNER="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          "$APKSIGNER" sign \
            --ks "$KEYSTORE" \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out wireless/RCN1C_Bridge.apk "$INPUT"
          "$APKSIGNER" verify --verbose --print-certs wireless/RCN1C_Bridge.apk | tee /tmp/beta4-signing.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' /tmp/beta4-signing.txt
          grep -q 'Verified using v3 scheme (APK Signature Scheme v3): true' /tmp/beta4-signing.txt
          grep -qi '7ff5f60b8917bd6c265a38ab6581a027ca4d571e2a5d4bf7d3e7becd04d131a7' /tmp/beta4-signing.txt
          sha256sum wireless/RCN1C_Bridge.apk | tee /tmp/SHA256SUMS.txt

      - name: Commit beta4 source and APK directly to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/one-time-beta4-main.yml
          git add -A
          git commit -m 'release(android): RC-N1C Flight Bridge v3.3.0-beta4'
          git push origin HEAD:main

      - name: Publish beta4 as latest GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.3.0-beta4
          target_commitish: main
          name: RC-N1C Flight Bridge v3.3.0-beta4
          prerelease: false
          make_latest: true
          body: |
            - Fixed in-app updater: GitHub release JSON is now parsed reliably and the updater accepts the canonical APK asset or an APK fallback.
            - Removed the Android Gamepad/Shizuku/uinput backup mode completely.
            - Home now contains only Portable Touch and PC Bridge, with larger cards.
            - Keeps the beta3 Portable Touch anti-freeze fixes.
          files: wireless/RCN1C_Bridge.apk

      - name: Upload beta4 artifact
        uses: actions/upload-artifact@v4
        with:
          name: RCN1C-Flight-Bridge-v3.3.0-beta4-STABLE
          path: wireless/RCN1C_Bridge.apk
