name: Rollback Android to beta7 behavior

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rollback-beta7.yml'

permissions:
  contents: write

jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore beta7 Android behavior
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force
          git checkout v3.3.0-beta7 -- \
            wireless/android-app/src/com/drone/rcn1cbridge/PortableTouchAccessibilityService.java \
            wireless/android-app/src/com/drone/rcn1cbridge/PortableTouchActivity.java \
            wireless/android-app/build.gradle.kts
          python3 - <<'PY'
          from pathlib import Path
          p = Path('wireless/android-app/build.gradle.kts')
          s = p.read_text(encoding='utf-8')
          s = s.replace('versionCode = 19', 'versionCode = 21')
          s = s.replace('versionName = "3.3.0-beta7"', 'versionName = "3.3.0-beta9-rollback"')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Verify rollback matches beta7 behavior
        shell: bash
        run: |
          set -euo pipefail
          git show v3.3.0-beta7:wireless/android-app/src/com/drone/rcn1cbridge/PortableTouchAccessibilityService.java > /tmp/beta7-service.java
          git show v3.3.0-beta7:wireless/android-app/src/com/drone/rcn1cbridge/PortableTouchActivity.java > /tmp/beta7-activity.java
          cmp /tmp/beta7-service.java wireless/android-app/src/com/drone/rcn1cbridge/PortableTouchAccessibilityService.java
          cmp /tmp/beta7-activity.java wireless/android-app/src/com/drone/rcn1cbridge/PortableTouchActivity.java
          grep -q 'versionCode = 21' wireless/android-app/build.gradle.kts
          grep -q 'versionName = "3.3.0-beta9-rollback"' wireless/android-app/build.gradle.kts

      - name: Install Android toolchain
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Download stable signing key
        uses: actions/download-artifact@v4
        with:
          name: RCN1C-beta2-v2v3-stable
          run-id: 32875790849
          github-token: ${{ github.token }}
          path: stable-key

      - name: Build and sign rollback APK
        shell: bash
        run: |
          set -euo pipefail
          cd wireless/android-app
          gradle --no-daemon clean assembleRelease
          cd ../..
          INPUT=$(find wireless/android-app/build/outputs/apk/release -name '*.apk' | head -n1)
          KEYSTORE=$(find stable-key -name 'RCN1C_Flight_Bridge_signing.keystore' | head -n1)
          APKSIGNER="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          "$APKSIGNER" sign \
            --ks "$KEYSTORE" \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out wireless/RCN1C_Bridge.apk "$INPUT"
          "$APKSIGNER" verify --verbose --print-certs wireless/RCN1C_Bridge.apk | tee /tmp/signing.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' /tmp/signing.txt
          grep -q 'Verified using v3 scheme (APK Signature Scheme v3): true' /tmp/signing.txt
          grep -qi '7ff5f60b8917bd6c265a38ab6581a027ca4d571e2a5d4bf7d3e7becd04d131a7' /tmp/signing.txt
          sha256sum wireless/RCN1C_Bridge.apk | tee /tmp/SHA256SUMS.txt

      - name: Commit rollback to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/rollback-beta7.yml
          git add -A
          git commit -m 'revert(android): restore beta7 portable touch behavior'
          git push origin HEAD:main

      - name: Publish rollback release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.3.0-beta9-rollback
          target_commitish: main
          name: RC-N1C Flight Bridge v3.3.0-beta9 rollback
          prerelease: false
          make_latest: true
          body: |
            Rollback release. Restores the Android Portable Touch implementation and activity behavior exactly to v3.3.0-beta7. Only the Android versionCode/versionName are increased so it can install directly over beta8.
          files: wireless/RCN1C_Bridge.apk

      - name: Upload rollback APK
        uses: actions/upload-artifact@v4
        with:
          name: RCN1C-Flight-Bridge-v3.3.0-beta9-ROLLBACK
          path: wireless/RCN1C_Bridge.apk
