name: Sign beta3 with stable Android key

on:
  push:
    branches:
      - fix/portable-touch-freeze
    paths:
      - '.github/workflows/sign-beta3-stable.yml'

jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - name: Download beta3 CI APK
        uses: actions/download-artifact@v4
        with:
          name: RCN1C-Flight-Bridge-v3.3.0-beta3-ci
          run-id: 32876846428
          github-token: ${{ github.token }}
          path: beta3

      - name: Download preserved beta2 signing key
        uses: actions/download-artifact@v4
        with:
          name: RCN1C-beta2-v2v3-stable
          run-id: 32875790849
          github-token: ${{ github.token }}
          path: stable-key

      - name: Re-sign and verify beta3
        shell: bash
        run: |
          set -euo pipefail
          INPUT=$(find beta3 -name '*.apk' | head -n1)
          KEYSTORE=$(find stable-key -name 'RCN1C_Flight_Bridge_signing.keystore' | head -n1)
          test -f "$INPUT"
          test -f "$KEYSTORE"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n1)
          test -x "$APKSIGNER"
          "$APKSIGNER" sign \
            --ks "$KEYSTORE" \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out RCN1C_Flight_Bridge_v3.3.0-beta3.apk "$INPUT"
          "$APKSIGNER" verify --verbose --print-certs RCN1C_Flight_Bridge_v3.3.0-beta3.apk | tee signing-verification.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' signing-verification.txt
          grep -q 'Verified using v3 scheme (APK Signature Scheme v3): true' signing-verification.txt
          grep -q '7ff5f60b' signing-verification.txt || { echo 'Stable certificate mismatch'; exit 1; }
          sha256sum RCN1C_Flight_Bridge_v3.3.0-beta3.apk > SHA256SUMS.txt

      - name: Upload stable beta3
        uses: actions/upload-artifact@v4
        with:
          name: RCN1C-Flight-Bridge-v3.3.0-beta3-STABLE
          path: |
            RCN1C_Flight_Bridge_v3.3.0-beta3.apk
            signing-verification.txt
            SHA256SUMS.txt
