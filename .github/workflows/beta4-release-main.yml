name: Finalize beta4 on main

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/beta4-release-main.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Remove legacy backup and finish UI/docs
        shell: python
        run: |
          from pathlib import Path
          import shutil
          root = Path('.')
          pfile = root / 'wireless/android-app/src/com/drone/rcn1cbridge/PortableTouchActivity.java'
          p = pfile.read_text(encoding='utf-8')
          start = p.index('        LinearLayout games = new LinearLayout(this);')
          end = p.index('\n\n        TextView note', start)
          replacement = '        Button freerider = button("APRI FPV FREERIDER", 0xFF102E44, 0xFF39C5FF);\n        freerider.setOnClickListener(v -> openFreerider(false));\n        root.addView(freerider, new LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, dp(44)));'
          p = p[:start] + replacement + p[end:]
          p = p.replace('Offline · nessun root/Wi-Fi/Shizuku', 'Offline · nessun root o Wi-Fi')
          p = p.replace('La prima volta abilita RC-N1C Flight Bridge in Accessibilità. Poi puoi usare questa modalità completamente offline. Shizuku resta solo nel backup Gamepad.', 'La prima volta abilita RC-N1C Flight Bridge in Accessibilità. Poi questa modalità funziona completamente offline.')
          pfile.write_text(p, encoding='utf-8')

          readme = (root / 'README.md').read_text(encoding='utf-8')
          readme = readme.replace('- modalità Android Gamepad per esporre il RC-N1C ai giochi Android;', '- modalità Portable Touch per usare il RC-N1C nei simulatori Android senza root, Shizuku o Wi-Fi;')
          a = readme.index('## App Android: RC-N1C Flight Bridge')
          b = readme.index('## Aggiornamenti')
          section = "## App Android: RC-N1C Flight Bridge\n\nL'APK offre due modalità principali:\n\n```text\nPORTABLE TOUCH\nRC-N1C → Android → controlli touch del simulatore\n\nPC BRIDGE\nRC-N1C → Android → UDP/Wi-Fi → PC → gamepad virtuale\n```\n\n**Portable Touch** è la modalità consigliata sul telefono: dopo aver abilitato una volta RC-N1C Flight Bridge in Accessibilità, funziona offline senza root, Shizuku, ADB o Wi-Fi. Il primo profilo supportato è FPV Freerider.\n\n**PC Bridge** mantiene il comportamento esistente e l'autodiscovery nella rete locale. Termux resta supportato come alternativa; vedi [docs/uso-wireless.md](docs/uso-wireless.md).\n\nPer ricostruire l'APK servono JDK 17, Android SDK 34 e Gradle 8.7+.\n\n"
          readme = readme[:a] + section + readme[b:]
          readme = readme.replace('Il workflow `.github/workflows/release.yml` ricostruisce e pubblica l\'APK quando viene creato un tag versione. Il branch `feature/android-virtual-gamepad` ha inoltre una CI dedicata che compila l\'APK dopo le modifiche Android.', 'Il workflow `.github/workflows/release.yml` ricostruisce, verifica la firma stabile e pubblica `RCN1C_Bridge.apk` per le release stabili.')
          (root / 'README.md').write_text(readme, encoding='utf-8')

          for rel in ['wireless/android-app/src/com/drone/rcn1cbridge/GamepadActivity.java','wireless/android-app/src/com/drone/rcn1cbridge/GamepadBridgeService.java','docs/android-gamepad.md','.github/workflows/android-gamepad-ci.yml']:
              f = root / rel
              if f.exists(): f.unlink()
          for rel in ['wireless/android-app/src/com/drone/rcn1cbridge/uinput','wireless/android-app/cpp']:
              d = root / rel
              if d.exists(): shutil.rmtree(d)

          active = '\n'.join(f.read_text(errors='ignore') for f in (root/'wireless/android-app').rglob('*') if f.is_file() and f.suffix in {'.java','.xml','.kts','.aidl','.cpp'})
          for forbidden in ['rikka.shizuku','GamepadActivity','GamepadBridgeService','UInputService','uinput_jni']:
              if forbidden in active: raise SystemExit('legacy reference remains: ' + forbidden)

      - name: Install Android toolchain
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Download stable signing key
        uses: actions/download-artifact@v4
        with:
          name: RCN1C-beta2-v2v3-stable
          run-id: 32875790849
          github-token: ${{ github.token }}
          path: stable-key

      - name: Build and sign beta4
        shell: bash
        run: |
          set -euo pipefail
          cd wireless/android-app
          gradle --no-daemon clean assembleRelease
          cd ../..
          INPUT=$(find wireless/android-app/build/outputs/apk/release -name '*.apk' | head -n1)
          KEYSTORE=$(find stable-key -name 'RCN1C_Flight_Bridge_signing.keystore' | head -n1)
          APKSIGNER="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          "$APKSIGNER" sign --ks "$KEYSTORE" --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android --v2-signing-enabled true --v3-signing-enabled true --out wireless/RCN1C_Bridge.apk "$INPUT"
          "$APKSIGNER" verify --verbose --print-certs wireless/RCN1C_Bridge.apk | tee /tmp/signing.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' /tmp/signing.txt
          grep -q 'Verified using v3 scheme (APK Signature Scheme v3): true' /tmp/signing.txt
          grep -qi '7ff5f60b8917bd6c265a38ab6581a027ca4d571e2a5d4bf7d3e7becd04d131a7' /tmp/signing.txt
          sha256sum wireless/RCN1C_Bridge.apk | tee /tmp/SHA256SUMS.txt

      - name: Commit beta4 to main
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/beta4-release-main.yml
          git add -A
          git commit -m 'release(android): RC-N1C Flight Bridge v3.3.0-beta4'
          git push origin HEAD:main

      - name: Publish beta4 release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.3.0-beta4
          target_commitish: main
          name: RC-N1C Flight Bridge v3.3.0-beta4
          prerelease: false
          make_latest: true
          body: |
            Fixed the in-app updater, removed the Shizuku/uinput backup mode completely, and expanded the two primary launcher modes. Keeps the beta3 Portable Touch anti-freeze fixes.
          files: wireless/RCN1C_Bridge.apk

      - name: Upload beta4 APK
        uses: actions/upload-artifact@v4
        with:
          name: RCN1C-Flight-Bridge-v3.3.0-beta4-STABLE
          path: wireless/RCN1C_Bridge.apk

