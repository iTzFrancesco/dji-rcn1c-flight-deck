name: Create stable release tag

on:
  push:
    branches:
      - feat/mobile-fpv-flight-deck
    paths:
      - .github/workflows/create-stable-release-tag.yml

permissions:
  contents: write

jobs:
  build-and-publish:
    if: contains(github.event.head_commit.message, '[release]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android toolchain
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Restore stable Android signing key
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.RCN1C_ANDROID_DEBUG_KEYSTORE_B64 }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "Missing RCN1C_ANDROID_DEBUG_KEYSTORE_B64"; exit 1; }
          mkdir -p "$HOME/.android"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey \
            | tr -d ':' | tr '[:upper:]' '[:lower:]' \
            | grep -q '7ff5f60b8917bd6c265a38ab6581a027ca4d571e2a5d4bf7d3e7becd04d131a7' \
            || { echo 'Configured keystore certificate does not match the stable APK signer'; exit 1; }

      - name: Build and verify Flight Bridge APK
        shell: bash
        run: |
          cd wireless/android-app
          gradle --no-daemon clean assembleRelease
          cp build/outputs/apk/release/*.apk ../RCN1C_Bridge.apk
          APKSIGNER="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          "$APKSIGNER" verify --verbose --print-certs ../RCN1C_Bridge.apk | tee /tmp/signing.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' /tmp/signing.txt
          grep -qi '7ff5f60b8917bd6c265a38ab6581a027ca4d571e2a5d4bf7d3e7becd04d131a7' /tmp/signing.txt

      - name: Create stable tag once
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: v3.3.0
        with:
          script: |
            const tag = process.env.RELEASE_TAG;
            try {
              await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `tags/${tag}`,
              });
              core.info(`${tag} already exists; nothing to do.`);
              return;
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            await github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `refs/tags/${tag}`,
              sha: context.sha,
            });
            core.info(`Created ${tag} at ${context.sha}.`);

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.3.0
          target_commitish: ${{ github.sha }}
          files: wireless/RCN1C_Bridge.apk
          prerelease: false
          make_latest: true
          generate_release_notes: true
