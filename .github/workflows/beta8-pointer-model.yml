name: Build beta8 pointer model

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/beta8-pointer-model.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Finish beta8 source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('wireless/android-app/src/com/drone/rcn1cbridge/PortableTouchActivity.java')
          s = p.read_text(encoding='utf-8')
          s = s.replace('PortableTouchAccessibilityService.requestCalibration()', 'PortableTouchAccessibilityService.requestCalibration(targetGamePackage)')
          s = s.replace('La prima volta abilita RC-N1C Flight Bridge in Accessibilità. Poi questa modalità funziona completamente offline.', 'In FPV Freerider seleziona Input: Touchscreen control. Poi calibra L/R esattamente sul centro dei due joystick.')
          p.write_text(s, encoding='utf-8')

          gpath = Path('wireless/android-app/build.gradle.kts')
          g = gpath.read_text(encoding='utf-8')
          g = g.replace('versionCode = 19', 'versionCode = 20')
          g = g.replace('versionName = "3.3.0-beta7"', 'versionName = "3.3.0-beta8"')
          gpath.write_text(g, encoding='utf-8')
          PY

      - name: Verify beta8 model
        shell: bash
        run: |
          grep -q 'class PointerState' wireless/android-app/src/com/drone/rcn1cbridge/PortableTouchAccessibilityService.java
          grep -q 'getBoundsInScreen' wireless/android-app/src/com/drone/rcn1cbridge/PortableTouchAccessibilityService.java
          grep -q 'p.moveTo(cx, cy)' wireless/android-app/src/com/drone/rcn1cbridge/PortableTouchAccessibilityService.java
          grep -q 'requestCalibration(targetGamePackage)' wireless/android-app/src/com/drone/rcn1cbridge/PortableTouchActivity.java
          grep -q 'Touchscreen control' wireless/android-app/src/com/drone/rcn1cbridge/PortableTouchActivity.java
          grep -q 'versionName = "3.3.0-beta8"' wireless/android-app/build.gradle.kts

      - name: Install Android toolchain
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Download stable signing key
        uses: actions/download-artifact@v4
        with:
          name: RCN1C-beta2-v2v3-stable
          run-id: 32875790849
          github-token: ${{ github.token }}
          path: stable-key

      - name: Build and sign beta8
        shell: bash
        run: |
          set -euo pipefail
          cd wireless/android-app
          gradle --no-daemon clean assembleRelease
          cd ../..
          INPUT=$(find wireless/android-app/build/outputs/apk/release -name '*.apk' | head -n1)
          KEYSTORE=$(find stable-key -name 'RCN1C_Flight_Bridge_signing.keystore' | head -n1)
          APKSIGNER="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          "$APKSIGNER" sign --ks "$KEYSTORE" --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android --v2-signing-enabled true --v3-signing-enabled true --out wireless/RCN1C_Bridge.apk "$INPUT"
          "$APKSIGNER" verify --verbose --print-certs wireless/RCN1C_Bridge.apk | tee /tmp/signing.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' /tmp/signing.txt
          grep -q 'Verified using v3 scheme (APK Signature Scheme v3): true' /tmp/signing.txt
          grep -qi '7ff5f60b8917bd6c265a38ab6581a027ca4d571e2a5d4bf7d3e7becd04d131a7' /tmp/signing.txt
          sha256sum wireless/RCN1C_Bridge.apk | tee /tmp/SHA256SUMS.txt

      - name: Commit beta8 to main
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/beta8-pointer-model.yml
          git add -A
          git commit -m 'release(android): RC-N1C Flight Bridge v3.3.0-beta8'
          git push origin HEAD:main

      - name: Publish beta8 release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.3.0-beta8
          target_commitish: main
          name: RC-N1C Flight Bridge v3.3.0-beta8
          prerelease: false
          make_latest: true
          body: |
            Rebuilds Portable Touch around the actual FPV simulator window and the real lifecycle of fixed virtual joysticks. Each RC stick now owns an independent synthetic pointer. A pointer starts with ACTION_DOWN at the calibrated joystick center, drags to the RC target, stays down only while that stick is active, and lifts independently. Calibration is stored relative to the real Freerider application-window bounds rather than the entire display. Old calibration is intentionally invalidated; recalibrate once in beta8. Also reminds users to select Touchscreen control in Freerider.
          files: wireless/RCN1C_Bridge.apk

      - name: Upload beta8 APK
        uses: actions/upload-artifact@v4
        with:
          name: RCN1C-Flight-Bridge-v3.3.0-beta8-STABLE
          path: wireless/RCN1C_Bridge.apk
