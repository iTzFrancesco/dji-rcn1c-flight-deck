name: Android release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Use the Android SDK already present on the GitHub runner. Installing only the
      # packages we actually need avoids downloading emulator/legacy tools.
      - name: Install required Android toolchain
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" "cmake;3.22.1" "ndk;26.3.11579264"

      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # IMPORTANT: releases must use the same local debug.keystore that signed v3.1.0.
      # Store its base64 contents in the repository secret RCN1C_ANDROID_DEBUG_KEYSTORE_B64.
      # We deliberately fail instead of generating a new key, because Android would reject
      # that APK as an update of an already-installed RC-N1C Flight Bridge.
      - name: Restore stable Android signing key
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.RCN1C_ANDROID_DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "Missing RCN1C_ANDROID_DEBUG_KEYSTORE_B64. Refusing to publish with a different signing key."
            exit 1
          fi
          mkdir -p "$HOME/.android"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"

      - name: Build unified Flight Bridge APK
        working-directory: wireless/android-app
        shell: bash
        run: |
          gradle --no-daemon clean assembleRelease
          cp build/outputs/apk/release/*.apk ../RCN1C_Bridge.apk

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: wireless/RCN1C_Bridge.apk
          generate_release_notes: true
