name: Execute corrected Portable Touch beta2

on:
  push:
    branches:
      - feature/portable-touch-fix
    paths:
      - '.github/workflows/execute-beta2-fixed.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/portable-touch-fix
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android toolchain
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" "cmake;3.22.1" "ndk;26.3.11579264"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Reuse beta2 generator and repair generated Java
        shell: python
        run: |
          from pathlib import Path
          import subprocess

          y = Path('.github/workflows/apply-portable-touch-beta2.yml').read_text()
          def get_block(name):
              marker = '      - name: ' + name
              i = y.index(marker)
              r = y.index('        run: |\n', i) + len('        run: |\n')
              n = y.find('\n      - name:', r)
              if n < 0: n = len(y)
              lines=[]
              for line in y[r:n].splitlines():
                  lines.append(line[10:] if line.startswith('          ') else line)
              return '\n'.join(lines)+'\n'

          exec(get_block('Apply beta2 fixes'), {})
          subprocess.run(['bash','-e'], input=get_block('Write clearer launcher and updater'), text=True, check=True)

          p=Path('wireless/android-app/src/com/drone/rcn1cbridge/MainActivity.java')
          s=p.read_text()
          s=s.replace('split("\\.")', 'split("[.]")')
          s=s.replace('Pattern.compile("(\\d+)")', 'Pattern.compile("([0-9]+)")')
          p.write_text(s)
      - name: Build beta2
        working-directory: wireless/android-app
        run: gradle --no-daemon clean assembleRelease
      - name: Commit verified source
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add wireless/android-app docs/touch-fix-notes.md
          git commit -m 'fix(android): portable touch beta2 and clearer launcher'
          git push origin HEAD:feature/portable-touch-fix
      - name: Upload beta2 APK
        uses: actions/upload-artifact@v4
        with:
          name: RCN1C-Flight-Bridge-v3.3.0-beta2
          path: wireless/android-app/build/outputs/apk/release/*.apk
