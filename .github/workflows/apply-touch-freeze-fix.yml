name: Apply Portable Touch freeze fix

on:
  push:
    branches:
      - fix/portable-touch-freeze
    paths:
      - '.github/workflows/apply-touch-freeze-fix.yml'

permissions:
  contents: write

jobs:
  patch-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/portable-touch-freeze

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Patch Portable Touch state machine
        shell: python
        run: |
          from pathlib import Path

          svc = Path('wireless/android-app/src/com/drone/rcn1cbridge/PortableTouchAccessibilityService.java')
          s = svc.read_text()
          s = s.replace('import android.view.accessibility.AccessibilityEvent;\n', 'import android.view.accessibility.AccessibilityEvent;\n\nimport java.util.concurrent.atomic.AtomicBoolean;\n')
          s = s.replace('private static final long STEP_MS = 24;', 'private static final long STEP_MS = 32;')
          s = s.replace('private boolean gestureInFlight = false;', 'private volatile boolean gestureInFlight = false;\n    private final AtomicBoolean driveScheduled = new AtomicBoolean(false);')
          s = s.replace('''    public static void kick() {\n        PortableTouchAccessibilityService s = instance;\n        if (s != null) s.handler.post(s::drive);\n    }\n''', '''    public static void kick() {\n        PortableTouchAccessibilityService s = instance;\n        if (s != null && !s.gestureInFlight) s.scheduleDrive(0);\n    }\n''')
          s = s.replace('''            lastState = "ARMED · " + label;\n            s.drive();\n''', '''            lastState = "ARMED · " + label;\n            s.scheduleDrive(0);\n''')
          s = s.replace('''            lastState = "Touch disarmato";\n            s.drive();\n''', '''            lastState = "Touch disarmato";\n            s.scheduleDrive(0);\n''')
          old_event = '''    @Override\n    public void onAccessibilityEvent(AccessibilityEvent event) {\n        if (event == null || event.getPackageName() == null) return;\n        foregroundPackage = event.getPackageName().toString();\n        if (isSupportedGame(foregroundPackage)) {\n            explicitlyArmed = true;\n            releaseRequested = false;\n            lastState = "ARMED · " + foregroundPackage;\n        } else if (getPackageName().equals(foregroundPackage)) {\n            explicitlyArmed = false;\n            releaseRequested = true;\n        }\n        drive();\n    }\n'''
          new_event = '''    @Override\n    public void onAccessibilityEvent(AccessibilityEvent event) {\n        if (event == null || event.getPackageName() == null) return;\n        foregroundPackage = event.getPackageName().toString();\n        // Never arm from Accessibility events. Unity/ColorOS may deliver stale window\n        // events after Flight Bridge is foreground again, which used to leave two\n        // synthetic fingers pressed over our own UI. Only an explicit game launch arms.\n        if (getPackageName().equals(foregroundPackage)) {\n            explicitlyArmed = false;\n            releaseRequested = true;\n            lastState = "Touch sospeso · Flight Bridge in primo piano";\n            scheduleDrive(0);\n        } else if (isSupportedGame(foregroundPackage) && !explicitlyArmed) {\n            lastState = "Gioco rilevato · in attesa di avvio";\n        }\n    }\n'''
          if old_event not in s: raise SystemExit('old accessibility event block not found')
          s = s.replace(old_event, new_event)
          marker = '''    private boolean shouldDrive() {\n'''
          scheduler = '''    private void scheduleDrive(long delayMs) {\n        if (!driveScheduled.compareAndSet(false, true)) return;\n        Runnable r = () -> {\n            driveScheduled.set(false);\n            drive();\n        };\n        if (delayMs <= 0) handler.post(r);\n        else handler.postDelayed(r, delayMs);\n    }\n\n'''
          if scheduler not in s:
              s = s.replace(marker, scheduler + marker)
          s = s.replace('else handler.post(PortableTouchAccessibilityService.this::drive);', 'else scheduleDrive(1);')
          s = s.replace('handler.postDelayed(PortableTouchAccessibilityService.this::drive, 40);', 'scheduleDrive(80);')
          s = s.replace('handler.postDelayed(this::drive, 120);', 'scheduleDrive(180);')
          svc.write_text(s)

          act = Path('wireless/android-app/src/com/drone/rcn1cbridge/PortableTouchActivity.java')
          a = act.read_text()
          a = a.replace('private Button startButton;', 'private Button startButton;\n    private int gameLaunchGeneration = 0;')
          a = a.replace('''    @Override protected void onResume() {\n        super.onResume();\n        PortableTouchAccessibilityService.disarm();\n''', '''    @Override protected void onResume() {\n        super.onResume();\n        gameLaunchGeneration++; // invalidate delayed arm/calibration from an old launch\n        PortableTouchAccessibilityService.disarm();\n''')
          a = a.replace('startButton = button("AVVIA",', 'startButton = button("COLLEGA RC",')
          a = a.replace('startButton.setText(PortableTouchBridgeService.active ? "FERMA" : "AVVIA");', 'startButton.setText(PortableTouchBridgeService.active ? "SCOLLEGA RC" : "COLLEGA RC");')
          old_open = '''    private void openFreerider(boolean calibrate) {\n        if (!isAccessibilityEnabled()) {\n            toast("Abilita prima il servizio Accessibilità di Flight Bridge");\n            return;\n        }\n        Intent game = getPackageManager().getLaunchIntentForPackage("com.Freeride.Freerider_FREE");\n        if (game == null) game = getPackageManager().getLaunchIntentForPackage("com.Freeride.Freerider");\n        if (game == null) {\n            toast("FPV Freerider non installato");\n            return;\n        }\n        startActivity(game);\n        if (calibrate) {\n            ui.postDelayed(() -> {\n                if (!PortableTouchAccessibilityService.requestCalibration()) {\n                    toast("Servizio Accessibilità non ancora collegato");\n                }\n            }, 900);\n        } else {\n            ui.postDelayed(() -> {\n                if (!PortableTouchAccessibilityService.armForGame("FPV Freerider")) {\n                    toast("Servizio Accessibilità non collegato");\n                }\n            }, 350);\n        }\n    }\n'''
          new_open = '''    private void openFreerider(boolean calibrate) {\n        if (!isAccessibilityEnabled()) {\n            toast("Abilita prima il servizio Accessibilità di Flight Bridge");\n            return;\n        }\n        if (!calibrate && (!PortableTouchBridgeService.active || PortableTouchBridgeService.latestFrame == null)) {\n            toast("Prima premi COLLEGA RC e aspetta che gli stick si muovano");\n            return;\n        }\n        Intent game = getPackageManager().getLaunchIntentForPackage("com.Freeride.Freerider_FREE");\n        if (game == null) game = getPackageManager().getLaunchIntentForPackage("com.Freeride.Freerider");\n        if (game == null) {\n            toast("FPV Freerider non installato");\n            return;\n        }\n        // Cancel old synthetic pointers before Android transitions away from our UI.\n        PortableTouchAccessibilityService.disarm();\n        final int launch = ++gameLaunchGeneration;\n        startActivity(game);\n        if (calibrate) {\n            ui.postDelayed(() -> {\n                if (launch != gameLaunchGeneration) return;\n                if (!PortableTouchAccessibilityService.requestCalibration()) {\n                    toast("Servizio Accessibilità non ancora collegato");\n                }\n            }, 1000);\n        } else {\n            // Give Unity/ColorOS enough time to own the screen before pressing two fingers.\n            ui.postDelayed(() -> {\n                if (launch != gameLaunchGeneration) return;\n                if (!PortableTouchAccessibilityService.armForGame("FPV Freerider")) {\n                    toast("Servizio Accessibilità non collegato");\n                }\n            }, 800);\n        }\n    }\n'''
          if old_open not in a: raise SystemExit('old openFreerider block not found')
          a = a.replace(old_open, new_open)
          act.write_text(a)

          gradle = Path('wireless/android-app/build.gradle.kts')
          g = gradle.read_text().replace('versionCode = 14', 'versionCode = 15').replace('versionName = "3.3.0-beta2"', 'versionName = "3.3.0-beta3"')
          gradle.write_text(g)

      - name: Install Android toolchain
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" "cmake;3.22.1" "ndk;26.3.11579264"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build beta3
        working-directory: wireless/android-app
        run: gradle --no-daemon clean assembleRelease

      - name: Commit verified fix
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add wireless/android-app/src/com/drone/rcn1cbridge/PortableTouchAccessibilityService.java wireless/android-app/src/com/drone/rcn1cbridge/PortableTouchActivity.java wireless/android-app/build.gradle.kts
          git commit -m 'fix(android): prevent Portable Touch from freezing Flight Bridge'
          git push origin HEAD:fix/portable-touch-freeze

      - name: Upload beta3 APK
        uses: actions/upload-artifact@v4
        with:
          name: RCN1C-Flight-Bridge-v3.3.0-beta3-ci
          path: wireless/android-app/build/outputs/apk/release/*.apk
